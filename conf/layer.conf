# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cartzy"
BBFILE_PATTERN_meta-cartzy = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cartzy = "6"
LAYERSERIES_COMPAT_meta-cartzy = "scarthgap"
